name: Android APK

on:
  push:
    branches: [agent/initial-cookclip-mvp]
    paths:
      - '.github/workflows/android-release.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
      RELEASE_TAG: v0.1.0-alpha.1
      APK_NAME: CookClip-0.1.0-alpha.1-android.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare downloadable files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" \
              --target "$GITHUB_SHA" \
              --title "CookClip 0.1.0 alpha 1" \
              --prerelease \
              --notes "Pierwsza testowa wersja CookClip na Androida. APK jest podpisany kluczem testowym i przeznaczony do ręcznej instalacji. Dane, analiza opisów i kompresja filmów działają lokalnie na urządzeniu."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookClip-Android-APK
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
