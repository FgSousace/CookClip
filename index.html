<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fff7ed" media="(prefers-color-scheme: light)" />
  <title>CookClip</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#fff7ed;--card:#fff;--text:#171717;--muted:#737373;--line:#e7e5e4;--accent:#f97316;--accent2:#ea580c;--danger:#dc2626}
    @media(prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#15181d;--text:#f5f5f5;--muted:#a3a3a3;--line:#2a2f36;--accent:#fb923c;--accent2:#f97316}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.app{max-width:980px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;padding:10px 0 14px;background:linear-gradient(var(--bg) 72%,transparent)}.brand{font-size:30px;font-weight:900;letter-spacing:-1px;flex:1}.brand span{color:var(--accent)}button,.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:750;background:var(--card);color:var(--text);box-shadow:0 2px 10px #00000012;cursor:pointer}.primary{background:var(--accent);color:white}.danger{background:var(--danger);color:white}.ghost{background:transparent;box-shadow:none}.filters{display:grid;grid-template-columns:1fr auto;gap:10px;margin:6px 0 10px}.search,input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--card);color:var(--text);font:inherit}.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 14px;scrollbar-width:none}.chip{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);box-shadow:none}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 8px 24px #0000000c}.thumb{aspect-ratio:1.35;border-radius:17px;background:color-mix(in srgb,var(--accent) 15%,transparent);display:grid;place-items:center;font-size:42px;position:relative;overflow:hidden}.fav{position:absolute;right:10px;top:8px;font-size:22px}.card h3{margin:10px 2px 5px;font-size:17px;line-height:1.15}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.empty{text-align:center;padding:80px 10px;color:var(--muted)}dialog{width:min(720px,calc(100% - 20px));max-height:92vh;border:1px solid var(--line);border-radius:24px;padding:0;background:var(--card);color:var(--text);overflow:hidden}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}.modalHead{display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}.modalHead h2{margin:0;flex:1}.content{padding:16px;overflow:auto;max-height:calc(92vh - 72px)}.section{margin:0 0 22px}.section h3{margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stack{display:grid;gap:9px}.itemRow{display:grid;grid-template-columns:1fr 90px 86px auto;gap:7px}.stepRow{display:grid;grid-template-columns:1fr 100px auto;gap:7px}.mini{padding:9px 10px;border-radius:11px}.detailVideo{width:100%;border-radius:18px;background:#000;max-height:390px}.detailTitle{display:flex;align-items:flex-start;gap:10px}.detailTitle h1{font-size:28px;line-height:1.05;margin:0;flex:1}.pill{background:color-mix(in srgb,var(--accent) 13%,transparent);padding:7px 10px;border-radius:999px;font-size:12px}.servings{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--text) 6%,transparent);padding:12px;border-radius:16px}.servings strong{font-size:24px;flex:1}.ingredient{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.ingredient.done{text-decoration:line-through;opacity:.55}.step{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:8px 0}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:800}.nutrition{width:100%;border-collapse:collapse}.nutrition th,.nutrition td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.muted{color:var(--muted)}.videoNote{font-size:12px;color:var(--muted);margin-top:7px}.hidden{display:none!important}@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.brand{font-size:34px}}@media(max-width:520px){.filters{grid-template-columns:1fr}.itemRow{grid-template-columns:1fr 72px 70px auto}.row{grid-template-columns:1fr}.top .label{display:none}}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">Cook<span>Clip</span></div><button id="favToggle">♡ <span class="label">Ulubione</span></button><button class="primary" id="addBtn">＋ <span class="label">Dodaj</span></button></div>
  <div class="filters"><input id="search" class="search" placeholder="Szukaj przepisu lub składnika…"><select id="sort"><option value="new">Najnowsze</option><option value="az">A–Z</option><option value="time">Najkrótszy czas</option></select></div>
  <div class="chips" id="chips"></div>
  <main id="grid" class="grid"></main>
</div>

<dialog id="editor"><div class="modalHead"><h2 id="editorTitle">Nowy przepis</h2><button class="ghost" onclick="editor.close()">✕</button></div><form id="form" class="content">
  <input type="hidden" id="rid">
  <div class="section stack"><h3>Podstawowe</h3><input id="title" required placeholder="Nazwa dania"><div class="row"><select id="category"></select><input id="servings" type="number" min="1" max="30" value="2" placeholder="Porcje"></div><label><input id="favorite" type="checkbox" style="width:auto"> Ulubiony</label></div>
  <div class="section stack"><h3>Film instruktażowy</h3><input id="video" type="file" accept="video/*"><div class="videoNote">Film zapisuje się lokalnie w pamięci Safari. Na iPhonie najlepiej używać krótszych, skompresowanych filmów.</div><div id="videoExisting" class="muted"></div></div>
  <div class="section"><h3>Składniki</h3><div id="ingredients" class="stack"></div><button type="button" id="addIngredient">＋ Dodaj składnik</button></div>
  <div class="section"><h3>Kroki</h3><div id="steps" class="stack"></div><button type="button" id="addStep">＋ Dodaj krok</button></div>
  <div class="section stack"><h3>Czas</h3><div class="row"><input id="prep" type="number" min="0" value="0" placeholder="Przygotowanie (min)"><input id="cook" type="number" min="0" value="0" placeholder="Gotowanie (min)"></div></div>
  <div class="section stack"><h3>Źródło</h3><input id="sourceName" placeholder="Nazwa źródła"><input id="sourceUrl" type="url" placeholder="https://…"></div>
  <div class="section stack"><h3>Wartości odżywcze / 1 porcja</h3><div class="row"><input id="kcal" type="number" step="0.1" placeholder="Kalorie (kcal)"><input id="protein" type="number" step="0.1" placeholder="Białko (g)"></div><div class="row"><input id="fat" type="number" step="0.1" placeholder="Tłuszcz (g)"><input id="carbs" type="number" step="0.1" placeholder="Węglowodany (g)"></div><div class="row"><input id="fiber" type="number" step="0.1" placeholder="Błonnik (g)"><input id="sugars" type="number" step="0.1" placeholder="Cukry (g)"></div><input id="salt" type="number" step="0.01" placeholder="Sól (g)"></div>
  <div class="section stack"><h3>Notatki</h3><textarea id="notes" rows="4" placeholder="Notatki…"></textarea></div>
  <div class="actions"><button type="button" onclick="editor.close()">Anuluj</button><button class="primary" type="submit">Zapisz przepis</button></div>
</form></dialog>

<dialog id="detail"><div class="modalHead"><h2>Przepis</h2><button class="ghost" onclick="detail.close()">✕</button></div><div id="detailBody" class="content"></div></dialog>

<script>
const CATEGORIES=['Wszystkie','Śniadanie','Obiad','Kolacja','Deser','Przekąska','Inne'];
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
let recipes=[], selectedCategory='Wszystkie', favoritesOnly=false, activeId=null, currentServings=1, videoUrls=[];
const dbp=new Promise((resolve,reject)=>{const r=indexedDB.open('CookClipDB',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('recipes'))d.createObjectStore('recipes',{keyPath:'id'});if(!d.objectStoreNames.contains('videos'))d.createObjectStore('videos',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function tx(store,mode,fn){const db=await dbp;return new Promise((res,rej)=>{const t=db.transaction(store,mode),s=t.objectStore(store);fn(s);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function load(){const db=await dbp;recipes=await new Promise((res,rej)=>{const r=db.transaction('recipes').objectStore('recipes').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});if(!recipes.length){const sample={id:crypto.randomUUID(),title:'Makaron carbonara',category:'Obiad',favorite:true,servings:2,ingredients:[{id:crypto.randomUUID(),name:'spaghetti',amount:200,unit:'g'},{id:crypto.randomUUID(),name:'jajka',amount:2,unit:'szt.'},{id:crypto.randomUUID(),name:'pecorino',amount:50,unit:'g'}],steps:[{id:crypto.randomUUID(),text:'Ugotuj makaron al dente.',time:8},{id:crypto.randomUUID(),text:'Podsmaż guanciale lub boczek.',time:28},{id:crypto.randomUUID(),text:'Połącz składniki poza ogniem.',time:72}],prep:10,cook:15,sourceName:'Własny przepis',sourceUrl:'',notes:'Sos ma być kremowy, bez śmietany.',nutrition:{kcal:640,protein:31,fat:27,carbs:68,fiber:3,sugars:2,salt:1.4},videoId:null,created:Date.now(),updated:Date.now()};recipes=[sample];await saveRecipe(sample)}render()}
function saveRecipe(r){return tx('recipes','readwrite',s=>s.put(r))}function deleteRecipe(id){return tx('recipes','readwrite',s=>s.delete(id))}function saveVideo(id,blob){return tx('videos','readwrite',s=>s.put({id,blob}))}
async function getVideo(id){if(!id)return null;const db=await dbp;return new Promise((res,rej)=>{const r=db.transaction('videos').objectStore('videos').get(id);r.onsuccess=()=>res(r.result?.blob||null);r.onerror=()=>rej(r.error)})}function deleteVideo(id){if(id)return tx('videos','readwrite',s=>s.delete(id))}
function renderChips(){chips.innerHTML='';CATEGORIES.forEach(c=>{const b=el('button','chip'+(c===selectedCategory?' active':''));b.textContent=c;b.onclick=()=>{selectedCategory=c;render()};chips.append(b)})}
function filtered(){let q=search.value.trim().toLowerCase(),arr=recipes.filter(r=>(selectedCategory==='Wszystkie'||r.category===selectedCategory)&&(!favoritesOnly||r.favorite)&&(!q||r.title.toLowerCase().includes(q)||r.ingredients.some(i=>i.name.toLowerCase().includes(q))));if(sort.value==='az')arr.sort((a,b)=>a.title.localeCompare(b.title,'pl'));else if(sort.value==='time')arr.sort((a,b)=>(a.prep+a.cook)-(b.prep+b.cook));else arr.sort((a,b)=>b.updated-a.updated);return arr}
function render(){renderChips();favToggle.textContent=favoritesOnly?'♥ Ulubione':'♡ Ulubione';grid.innerHTML='';const arr=filtered();if(!arr.length){grid.className='empty';grid.textContent='Brak przepisów. Dodaj pierwszy przyciskiem +.';return}grid.className='grid';arr.forEach(r=>{const c=el('article','card');c.innerHTML=`<div class="thumb">${r.videoId?'▶️':'🍳'}${r.favorite?'<span class="fav">❤️</span>':''}</div><h3>${esc(r.title)}</h3><div class="meta"><span>⏱ ${r.prep+r.cook} min</span><span>👥 ${r.servings}</span></div>`;c.onclick=()=>openDetail(r.id);grid.append(c)})}
function esc(s=''){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function n(v){return Number(v)||0}
function ingredientRow(i={id:crypto.randomUUID(),name:'',amount:'',unit:'g'}){const d=el('div','itemRow');d.dataset.id=i.id;d.innerHTML=`<input class="iname" placeholder="Składnik" value="${esc(i.name||'')}"><input class="iamount" type="number" step="0.01" placeholder="Ilość" value="${i.amount??''}"><input class="iunit" placeholder="j." value="${esc(i.unit||'')}"><button type="button" class="mini">✕</button>`;d.querySelector('button').onclick=()=>d.remove();ingredients.append(d)}
function stepRow(s={id:crypto.randomUUID(),text:'',time:''}){const d=el('div','stepRow');d.dataset.id=s.id;d.innerHTML=`<textarea class="stext" rows="2" placeholder="Opis kroku">${esc(s.text||'')}</textarea><input class="stime" type="number" min="0" placeholder="sek." value="${s.time??''}"><button type="button" class="mini">✕</button>`;d.querySelector('button').onclick=()=>d.remove();steps.append(d)}
function fillCats(){category.innerHTML=CATEGORIES.slice(1).map(c=>`<option>${c}</option>`).join('')}
function openEditor(r=null){form.reset();rid.value=r?.id||'';editorTitle.textContent=r?'Edytuj przepis':'Nowy przepis';fillCats();title.value=r?.title||'';category.value=r?.category||'Obiad';servings.value=r?.servings||2;favorite.checked=!!r?.favorite;prep.value=r?.prep||0;cook.value=r?.cook||0;sourceName.value=r?.sourceName||'';sourceUrl.value=r?.sourceUrl||'';notes.value=r?.notes||'';for(const k of ['kcal','protein','fat','carbs','fiber','sugars','salt'])document.getElementById(k).value=r?.nutrition?.[k]??'';ingredients.innerHTML='';(r?.ingredients?.length?r.ingredients:[{}]).forEach(ingredientRow);steps.innerHTML='';(r?.steps?.length?r.steps:[{}]).forEach(stepRow);videoExisting.textContent=r?.videoId?'Film jest już zapisany lokalnie. Wybranie nowego zastąpi stary.':'';editor.showModal()}
form.onsubmit=async e=>{e.preventDefault();const old=recipes.find(x=>x.id===rid.value);const id=old?.id||crypto.randomUUID();let videoId=old?.videoId||null;const f=video.files[0];if(f){if(videoId)await deleteVideo(videoId);videoId=crypto.randomUUID();await saveVideo(videoId,f)}const r={id,title:title.value.trim(),category:category.value,favorite:favorite.checked,servings:Math.max(1,n(servings.value)),ingredients:[...ingredients.children].map(d=>({id:d.dataset.id||crypto.randomUUID(),name:d.querySelector('.iname').value.trim(),amount:n(d.querySelector('.iamount').value),unit:d.querySelector('.iunit').value.trim()})).filter(x=>x.name),steps:[...steps.children].map(d=>({id:d.dataset.id||crypto.randomUUID(),text:d.querySelector('.stext').value.trim(),time:n(d.querySelector('.stime').value)})).filter(x=>x.text),prep:n(prep.value),cook:n(cook.value),sourceName:sourceName.value.trim(),sourceUrl:sourceUrl.value.trim(),notes:notes.value.trim(),nutrition:Object.fromEntries(['kcal','protein','fat','carbs','fiber','sugars','salt'].map(k=>[k,n(document.getElementById(k).value)])),videoId,created:old?.created||Date.now(),updated:Date.now()};await saveRecipe(r);recipes=recipes.filter(x=>x.id!==id).concat(r);editor.close();render()}
async function openDetail(id){const r=recipes.find(x=>x.id===id);if(!r)return;activeId=id;currentServings=r.servings;videoUrls.forEach(URL.revokeObjectURL);videoUrls=[];let video='';const blob=await getVideo(r.videoId);if(blob){const u=URL.createObjectURL(blob);videoUrls.push(u);video=`<video id="player" class="detailVideo" controls playsinline src="${u}"></video>`}detailBody.innerHTML=`${video}<div class="section detailTitle"><h1>${esc(r.title)}</h1><span class="pill">${esc(r.category)}</span></div><div class="section servings"><strong>Porcje: <span id="servCount">${currentServings}</span></strong><button id="minus">−</button><button id="plus">＋</button></div><div class="section"><h3>Składniki</h3><div id="detailIngredients"></div></div><div class="section"><h3>Kroki</h3>${r.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div>${esc(s.text)}${blob?`<div><button class="mini timestamp" data-t="${s.time}">▶ ${fmt(s.time)}</button></div>`:''}</div></div>`).join('')}</div><div class="section"><h3>Czas</h3><div class="muted">Przygotowanie ${r.prep} min · Gotowanie ${r.cook} min · Razem ${r.prep+r.cook} min</div></div>${nutritionHtml(r)}${r.sourceName||r.sourceUrl?`<div class="section"><h3>Źródło</h3>${r.sourceUrl?`<a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">${esc(r.sourceName||r.sourceUrl)}</a>`:esc(r.sourceName)}</div>`:''}${r.notes?`<div class="section"><h3>Notatki</h3><div>${esc(r.notes)}</div></div>`:''}<div class="actions"><button id="favDetail">${r.favorite?'♥ Usuń z ulubionych':'♡ Dodaj do ulubionych'}</button><button id="editDetail">Edytuj</button><button class="danger" id="deleteDetail">Usuń</button></div>`;renderDetailIngredients(r);minus.onclick=()=>{if(currentServings>1){currentServings--;servCount.textContent=currentServings;renderDetailIngredients(r)}};plus.onclick=()=>{currentServings++;servCount.textContent=currentServings;renderDetailIngredients(r)};detailBody.querySelectorAll('.timestamp').forEach(b=>b.onclick=()=>{const p=$('#player');if(p){p.currentTime=n(b.dataset.t);p.play()}});favDetail.onclick=async()=>{r.favorite=!r.favorite;r.updated=Date.now();await saveRecipe(r);render();openDetail(r.id)};editDetail.onclick=()=>{detail.close();openEditor(r)};deleteDetail.onclick=async()=>{if(confirm('Usunąć ten przepis?')){await deleteRecipe(r.id);await deleteVideo(r.videoId);recipes=recipes.filter(x=>x.id!==r.id);detail.close();render()}};detail.showModal()}
function renderDetailIngredients(r){const m=currentServings/r.servings;detailIngredients.innerHTML=r.ingredients.map((i,idx)=>`<label class="ingredient"><input type="checkbox" style="width:auto" onchange="this.parentElement.classList.toggle('done',this.checked)"><span><strong>${round(i.amount*m)} ${esc(i.unit)}</strong> ${esc(i.name)}</span></label>`).join('')}
function nutritionHtml(r){const labels={kcal:'Kalorie',protein:'Białko',fat:'Tłuszcz',carbs:'Węglowodany',fiber:'Błonnik',sugars:'Cukry',salt:'Sól'};return `<div class="section"><h3>Wartości odżywcze</h3><table class="nutrition"><tr><th></th><th>/ porcję</th><th>Całość (${currentServings})</th></tr>${Object.entries(labels).map(([k,l])=>`<tr><td>${l}</td><td>${round(r.nutrition[k])}${k==='kcal'?' kcal':' g'}</td><td>${round(r.nutrition[k]*currentServings)}${k==='kcal'?' kcal':' g'}</td></tr>`).join('')}</table></div>`}function round(v){return Math.round((Number(v)||0)*100)/100}function fmt(s){s=n(s);return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
addBtn.onclick=()=>openEditor();favToggle.onclick=()=>{favoritesOnly=!favoritesOnly;render()};search.oninput=render;sort.onchange=render;addIngredient.onclick=()=>ingredientRow();addStep.onclick=()=>stepRow();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});fillCats();load();
</script>
</body>
</html>
